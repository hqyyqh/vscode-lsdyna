name: Build and quick checks / 构建与快速检查

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  LSDYNA_CI_FUNCTIONAL_ONLY: '1'

permissions:
  contents: read

concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Development feedback only. public-ci.yml remains the complete release gate.
jobs:
  build:
    name: Build and smoke tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:native-sqlite
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run build
      - name: Check core editing and completion behavior
        run: >-
          npx --no-install mocha --bail --require test/support/register-out.js
          test/core/keywordCardMaintenance.test.js
          "test/core/completion/*.test.js"
          test/scripts/release/publicWorkflow.test.js
      - name: Check official field choice functionality
        run: >-
          npx --no-install mocha --bail --require test/support/register-out.js
          test/integration/extension.test.js --grep "official field value completions"
      - run: npm run test:webview:compiled

  contracts:
    name: Data, source inventory and dependency checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      # The verifier needs compiled schema helpers and generated runtime indexes, not Webviews.
      - run: npm run compile
      - run: npm run check:contracts
      - run: npm audit
