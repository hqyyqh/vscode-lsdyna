name: Public collaboration / 公开协作

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    name: Build, data, tests, audit and actual VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Build all product components
        run: npm run build
      - name: Verify deterministic public data and source inventory
        run: |
          npm run data:check
          npm run update:source-manifest -- --check
          npm run check:contracts
      - run: npm test
      - run: npm run test:webview
      - name: Public Python regression tests
        run: python -m unittest discover -s test/scripts/build/keywords -p "test_*.py" -v
      - name: Bilingual content checks
        run: |
          npm run check:field-data-zh
          npm run check:native-help-zh
          npm run check:manual-semantics-zh
      - name: Audit development and shipped dependencies
        run: |
          npm audit
          npm audit --omit=dev
      - name: Package and inspect the actual candidate
        run: |
          node scripts/release/package-hover-release.cjs dist/candidate.vsix
          node scripts/release/validate-package-contents.cjs --vsix dist/candidate.vsix
          node scripts/release/verify-release-hash.cjs dist/candidate.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-vsix
          path: |
            dist/candidate.vsix
            dist/candidate.vsix.identity.json
            dist/candidate.vsix.data-equivalence.json
          if-no-files-found: error
          retention-days: 14

  installed-host:
    name: Same VSIX / ${{ matrix.os }} / VS Code ${{ matrix.vscode }}
    needs: public-checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        vscode: ['1.100.0', '1.139.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-vsix
          path: dist
      - name: Verify identity and exercise installed candidate
        shell: bash
        env:
          LSDYNA_TEST_VSIX: dist/candidate.vsix
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
          LSDYNA_TEST_VSIX_EVIDENCE: .artifacts/public-host
        run: |
          node scripts/release/verify-release-hash.cjs "$LSDYNA_TEST_VSIX"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node scripts/host/run-installed-acceptance.cjs
          else
            node scripts/host/run-installed-acceptance.cjs
          fi
      - name: Upload results, including incomplete runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installed-${{ matrix.os }}-${{ matrix.vscode }}
          path: .artifacts/public-host
          if-no-files-found: warn
          retention-days: 14

