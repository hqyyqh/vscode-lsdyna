name: Public collaboration / 公开协作

on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:
    inputs:
      node:
        description: 'Select full for complete acceptance, or one diagnostic node'
        type: choice
        options: [full, build, unit, webview, contracts, language, audit, package, installed]
        default: full
      target:
        description: 'Platform for a single node'
        type: choice
        options: [win32-x64, linux-x64, darwin-arm64]
        default: linux-x64
      vscode:
        description: 'VS Code for a single installed node'
        type: choice
        options: ['1.100.0', '1.139.1']
        default: '1.100.0'
      test_grep:
        description: 'Required Mocha name pattern for the unit node'
        type: string
      test_file:
        description: 'Single test file for the unit node, relative to test/'
        type: string
        default: integration/extension.test.js
      host_case:
        description: 'Installed functional case names (comma-separated)'
        type: string
      build_run:
        description: 'Reuse passed platform builds from this run (or leave empty for full CI)'
        type: string
      resume_run:
        description: 'With build_run: installed resume; without it: reviewed manager-reader unit recovery'
        type: string
      retry_exclude:
        description: 'Optional JSON matrix exclusions for installation-only retries'
        type: string

env:
  LSDYNA_CI_FUNCTIONAL_ONLY: '1'

permissions:
  contents: read
  actions: read

concurrency:
  group: public-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selected-node:
    name: Selected node
    if: ${{ inputs.node && inputs.node != 'full' }}
    uses: ./.github/workflows/ci-node.yml
    with:
      node: ${{ inputs.node }}
      target: ${{ inputs.target }}
      vscode: ${{ inputs.vscode }}
      test_grep: ${{ inputs.test_grep }}
      test_file: ${{ inputs.test_file }}
      host_case: ${{ inputs.host_case }}
      build_run: ${{ inputs.build_run }}
      resume_run: ${{ inputs.resume_run }}
  platforms:
    if: ${{ (!inputs.node || inputs.node == 'full') && !inputs.build_run }}
    name: Platform / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: win32-x64 }
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: macos-14, target: darwin-arm64 }
    uses: ./.github/workflows/ci-platform.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      resume_run: ${{ inputs.resume_run || '' }}

  installed-host:
    name: Retry / ${{ matrix.platform.target }} / ${{ matrix.vscode }}
    if: ${{ (!inputs.node || inputs.node == 'full') && github.event_name == 'workflow_dispatch' && inputs.build_run }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-2022, target: win32-x64 }
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: macos-14, target: darwin-arm64 }
        vscode: ['1.100.0', '1.139.1']
        exclude: ${{ fromJSON(inputs.retry_exclude || '[]') }}
    uses: ./.github/workflows/ci-installed.yml
    with:
      os: ${{ matrix.platform.os }}
      target: ${{ matrix.platform.target }}
      vscode: ${{ matrix.vscode }}
      build_run: ${{ inputs.build_run }}
      resume_run: ${{ inputs.resume_run || inputs.build_run }}
