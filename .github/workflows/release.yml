name: Release extension

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      reuse_plan:
        description: 'JSON buildRun and six host run IDs; empty builds fresh evidence'
        type: string
        default: ''
      publish:
        description: Publish to Visual Studio Marketplace and Open VSX
        required: true
        type: boolean
        default: false
      github_only:
        description: 'Publish GitHub Release only / 仅补发 GitHub Release（需 reuse_plan）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publishing
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: ${{ !inputs.reuse_plan }}
    needs: metadata
    uses: ./.github/workflows/public-ci.yml
  reuse:
    needs: metadata
    if: ${{ inputs.reuse_plan != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify existing artifacts and acceptance provenance without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_PLAN: ${{ inputs.reuse_plan }}
        run: node scripts/release/reuse-release-evidence.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-reuse-bundle
          path: |
            packages
            acceptance-evidence
            reuse-verification.json
          if-no-files-found: error
          retention-days: 14
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate release metadata
        id: metadata
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
          GITHUB_ONLY: ${{ inputs.github_only }}
          REUSE_PLAN: ${{ inputs.reuse_plan }}
        run: node scripts/release/release-plan.cjs


  publish:
    needs: [build, reuse, metadata]
    if: ${{ always() && needs.metadata.result == 'success' && needs.metadata.outputs.publish == 'true' && (needs.build.result == 'success' || needs.reuse.result == 'success') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_plan }}
        with:
          pattern: candidate-*
          path: packages
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_plan }}
        with:
          pattern: installed-*
          path: acceptance-evidence
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_plan != '' }}
        with:
          name: verified-reuse-bundle
          path: .
      - name: Verify immutable release artifact and acceptance matrix
        env:
          REUSE_PLAN: ${{ inputs.reuse_plan }}
        run: |
          for target in win32-x64 linux-x64 darwin-arm64; do
            package="packages/candidate-$target/candidate.vsix"
            node scripts/release/verify-release-hash.cjs "$package"
            node scripts/release/verify-release-acceptance.cjs "$package" acceptance-evidence "$target"
          done

      - name: Extract versioned release notes
        run: node scripts/release/release-plan.cjs --notes

      - name: Verify release destination
        id: destination
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag_name }}
        run: node scripts/release/verify-release-destination.cjs

      - name: Verify Open VSX credentials
        if: ${{ !inputs.github_only }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${OVSX_PAT}" ]] || { echo "Missing repository secret: OVSX_PAT" >&2; exit 1; }

      - name: Sign in to Azure with GitHub OIDC
        if: ${{ !inputs.github_only }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to Visual Studio Marketplace
        if: ${{ !inputs.github_only }}
        run: |
          for package in packages/candidate-*/candidate.vsix; do
            npx --no-install vsce publish --azure-credential --packagePath "$package" --skip-duplicate
          done

      - name: Publish to Open VSX
        if: ${{ !inputs.github_only }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for package in packages/candidate-*/candidate.vsix; do
            npx --no-install ovsx --pat "$OVSX_PAT" publish "$package" --skip-duplicate
          done

      - name: Name platform release assets
        run: |
          mkdir -p release-assets
          for target in win32-x64 linux-x64 darwin-arm64; do
            cp "packages/candidate-$target/candidate.vsix" "release-assets/dynasense-${{ needs.metadata.outputs.version }}-$target.vsix"
          done
      - name: Create GitHub Release
        if: ${{ steps.destination.outputs.published != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: DynaSense ${{ needs.metadata.outputs.version }}
          files: release-assets/*.vsix
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: false
          append_body: false
          body_path: release-notes.md
      - name: Publish completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto'), assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const releases = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`], { encoding: 'utf8' }));
          const release = releases.find(item => item.tag_name === process.env.RELEASE_TAG);
          assert.ok(release, 'Expected release');
          const files = fs.readdirSync('release-assets').filter(name => name.endsWith('.vsix')).sort();
          assert.equal(files.length, 3);
          assert.deepEqual(release.assets.map(asset => asset.name).sort(), files);
          for (const name of files) {
            const bytes = fs.readFileSync(`release-assets/${name}`), asset = release.assets.find(item => item.name === name);
            assert.equal(asset.state, 'uploaded');
            assert.equal(asset.size, bytes.length);
            assert.equal(asset.digest, `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          }
          NODE
          if [[ "${{ steps.destination.outputs.published }}" != "true" ]]; then
            gh release edit "$RELEASE_TAG" --tag "$RELEASE_TAG" --draft=false --latest
          fi

      - name: Create marketplace release verification issue
        if: ${{ !inputs.github_only }}
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        with:
          script: |
            const coordinator = require('./.github/scripts/marketplace-release.cjs');
            const issue = await coordinator.ensureMarketplaceReleaseIssue({
              github,
              context,
              version: process.env.RELEASE_VERSION
            });
            core.info(`Marketplace release verification issue: #${issue.number}`);
