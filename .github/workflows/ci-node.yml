name: CI node / 单节点验证

on:
  workflow_call:
    inputs:
      node: { type: string, required: true }
      target: { type: string, required: true }
      vscode: { type: string, default: '1.100.0' }
      test_grep: { type: string, default: '' }
      test_file: { type: string, default: 'integration/extension.test.js' }
      host_case: { type: string, default: '' }
      build_run: { type: string, default: '' }
      resume_run: { type: string, default: '' }

permissions:
  contents: read
  actions: read

jobs:
  node:
    name: Node / ${{ inputs.target }} / ${{ inputs.node }}${{ inputs.node == 'installed' && format(' / {0}', inputs.vscode) || '' }}
    runs-on: ${{ fromJSON('{"win32-x64":"windows-2022","linux-x64":"ubuntu-22.04","darwin-arm64":"macos-14"}')[inputs.target] }}
    # Deadlock watchdog, not a product response-time gate. No full-suite work here.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LSDYNA_CI_FUNCTIONAL_ONLY: '1'
      CI_NODE: ${{ inputs.node }}
      EXPECTED_TARGET: ${{ inputs.target }}
      VSCODE_TEST_VERSION: ${{ inputs.vscode }}
      TEST_GREP: ${{ inputs.test_grep }}
      TEST_FILE: ${{ inputs.test_file }}
      LSDYNA_ACCEPTANCE_CASE: ${{ inputs.host_case }}
      BUILD_RUN: ${{ inputs.build_run }}
      RESUME_RUN: ${{ inputs.resume_run }}
      LSDYNA_TEST_VSIX: dist/candidate.vsix
      LSDYNA_TEST_VSIX_EVIDENCE: .artifacts/public-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Validate request and record exact source
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const { CI_NODE: node, EXPECTED_TARGET: target, TEST_GREP: grep, LSDYNA_ACCEPTANCE_CASE: hostCase, BUILD_RUN: build, RESUME_RUN: resume } = process.env;
          assert.ok(['build','unit','webview','contracts','language','audit','package','installed'].includes(node));
          assert.equal(process.platform + '-' + process.arch, target);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/dev', 'Node diagnosis is restricted to dev');
          if (node === 'unit') {
            assert.ok(grep.trim(), 'Select the failed test, not the entire suite'); new RegExp(grep);
            const path = require('node:path'), base = fs.realpathSync('test'), file = fs.realpathSync(path.resolve(base, process.env.TEST_FILE));
            const relative = path.relative(base, file);
            assert.ok(relative && !relative.startsWith('..') && !path.isAbsolute(relative) && file.endsWith('.test.js'));
            assert.ok(fs.statSync(file).isFile());
          }
          if (node === 'installed') assert.ok(hostCase.trim(), 'Select one installed case');
          if (node === 'installed') assert.match(build, /^\d+$/);
          if (resume) { assert.equal(node, 'installed'); assert.match(resume, /^\d+$/); }
          fs.mkdirSync('.artifacts/node', {recursive:true});
          fs.writeFileSync('.artifacts/node/request.json', JSON.stringify({source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node,target,grep,testFile:process.env.TEST_FILE,hostCase,build,resume,vscode:process.env.VSCODE_TEST_VERSION}, null, 2));
          NODE
      - run: npm ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build necessary source dependencies
        if: ${{ inputs.node != 'installed' && inputs.node != 'audit' }}
        run: |
          if [[ "$CI_NODE" == "build" || "$CI_NODE" == "package" || "$CI_NODE" == "unit" ]]; then
            npm run build:native-sqlite
          fi
          if [[ "$CI_NODE" == "build" || "$CI_NODE" == "package" ]]; then
            npm run build
          else
            npm run compile
          fi
      - name: Run only the requested source node
        run: |
          case "$CI_NODE" in
            unit) npx --no-install mocha --bail --fail-zero --require test/support/register-out.js "test/$TEST_FILE" --grep "$TEST_GREP" --reporter json > .artifacts/node/unit.json ;;
            webview) npm run test:webview ;;
            contracts) npm run check:contracts ;;
            language) npm run check:field-data-zh && npm run check:native-help-zh && npm run check:manual-semantics-zh ;;
            audit) npm audit && npm audit --omit=dev ;;
            package)
              node scripts/release/package-hover-release.cjs dist/candidate.vsix "$EXPECTED_TARGET"
              node scripts/release/validate-package-contents.cjs --vsix dist/candidate.vsix
              node scripts/release/verify-release-hash.cjs dist/candidate.vsix ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.node == 'package' }}
        with:
          name: candidate-${{ inputs.target }}
          path: dist/candidate.vsix*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.node == 'installed' }}
        with:
          name: candidate-${{ inputs.target }}
          path: dist
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Verify build inputs and optional earlier case results
        if: ${{ inputs.node == 'installed' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/host/run-installed-acceptance-retry.cjs
      - name: Run selected installed functional case
        if: ${{ inputs.node == 'installed' }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then export TMPDIR="$(mktemp -d /tmp/ds.XXXXXX)"; fi
          launcher=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then launcher=(xvfb-run -a); fi
          "${launcher[@]}" node scripts/host/run-installed-acceptance.cjs
      - name: Prepare public case evidence
        if: ${{ always() && (inputs.node == 'installed') }}
        run: node scripts/release/public-release-reports.cjs .artifacts/public-host public-acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && (inputs.node == 'installed') }}
        with:
          name: installed-${{ inputs.target }}-${{ inputs.vscode }}
          path: public-acceptance
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: node-${{ inputs.target }}-${{ inputs.node }}
          path: .artifacts/node
          if-no-files-found: warn
          retention-days: 14
